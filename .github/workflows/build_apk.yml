name: Compilar APK Android Flutter

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile_app/**'
      - '.github/workflows/**'

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar y configurar soporte nativo Android
        run: |
          cd mobile_app
          flutter create . --platforms=android --org com.viernes.academic
          
          # Forzar compileSdk = 36 exigido por androidx.core 1.17.0
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/compileSdk = .*/compileSdk = 36/g' {} +
          find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' {} +
          find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' {} +
          find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' {} +
          
          flutter pub get

      - name: Compilar APK en modo Release
        run: |
          cd mobile_app
          flutter build apk --release

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Viernes-Academic-Android
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
