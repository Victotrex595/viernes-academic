name: Compilar APK Android Flutter

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile_app/**'

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar soporte nativo Android
        run: |
          cd mobile_app
          flutter create . --platforms=android
          flutter pub get

      - name: Compilar APK en modo Release
        run: |
          cd mobile_app
          flutter build apk --release

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Viernes-Academic-Android
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
