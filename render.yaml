services:
  - type: web
    name: viernes-academic
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PHONEAPP_DATA_DIR
        value: /tmp/data
